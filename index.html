// Picture intake. Covers are 400x600 and banners 1900x400. A picture whose shape already matches is just resized;

};

    CR = { im, W, H, cb, s, dw, dh, max, w: max, x: (dw - max) / 2, y: (dh - max * H / W) / 2 };
    $('#m').innerHTML = `<div class="sheet wide">\
<div class="mh" style="background:var(--nav)">Crop ${W > H * 2 ? 'banner' : 'cover'} · ${W} × ${H}</div><div class="mb">
<div class="cst" id="cst" style="width:${dw}px;height:${dh}px"><img src="${im.src}"><div class="cbx" id="cbx"></div></div>
<div class="crow"><label>Zoom</label><input type="range" id="czm" min="15" max="100" value="100"></div>
<div class="ft"><div class="sp"></div><button class="ghost d" onclick="cropNo()">Cancel</button>\
<button class="btn" onclick="cropOk()">Use this crop</button></div></div></div>`;
