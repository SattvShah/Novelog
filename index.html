// the year when the range is a whole calendar year (Jan 1 - Dec 31) or this year so far (Jan 1 - today), else 0
function rgYear() {
    const y = RG.f.slice(0, 4);
    return RG.f === y + '-01-01' && (RG.t === y + '-12-31' || y === today().slice(0, 4) && RG.t === today()) ? +y : 0;
}
// set the range to one calendar year: Jan 1 - Dec 31, or Jan 1 - today for this year
const rgSetYear = y => rgSet(y + '-01-01', y === +today().slice(0, 4) ? today() : y + '-12-31');
// slide the window back (-1) or forward (1) by its own length; forward stops at today (the length is kept).
// A calendar year moves by whole years instead, so the year before "this year" is Jan - Dec and not a shifted ten months.
function rgShift(dir) {
    if (!rgOn())
        return;
    const y = rgYear() + dir;
    if (rgYear())
        return y <= +today().slice(0, 4) && rgSetYear(y);
    const f = RG.f || rgFirst(), t = RG.t || today(), len = Math.round((Date.parse(t) - Date.parse(f)) / 864e5) + 1;
    const room = Math.round((Date.parse(today()) - Date.parse(t)) / 864e5), step = dir > 0 ? Math.min(len, room) : -len;
    if (len < 1 || !step)
        return;
    RG.f = iso(Date.parse(f) + step * 864e5);
    RG.t = iso(Date.parse(t) + step * 864e5);
}
// what a bar button does
function rgAct(k) {
    if (k === 'prev' || k === 'next')
        return rgShift(k === 'next' ? 1 : -1);
    const p = rgPreset(k);
    rgSet(p[0], p[1]);
}
// last day the calendar shows: the range's end, never later than today
const rgEnd = () => RG.t && RG.t < today() ? RG.t : today();
// days a speed-chart period (key = week's Monday or 'YYYY-MM') is divided by: 7 / 30, or only its days inside the range when it cuts the period
function perDays(k) {
    const month = ui.per === 'month', nom = month ? 30 : 7;
    if (!rgOn())
        return nom;
    const a = month ? k + '-01' : k, b = month ? iso(Date.UTC(+k.slice(0, 4), +k.slice(5, 7), 0)) : iso(Date.parse(k) + 6 * 864e5);
    const lo = RG.f > a ? RG.f : a, hi = RG.t && RG.t < b ? RG.t : b, span = (x, y) => Math.round((Date.parse(y) - Date.parse(x)) / 864e5) + 1;
    return span(lo, hi) >= span(a, b) ? nom : Math.max(1, span(lo, hi));
}
// one quick button; lit when the range is exactly what it stands for
const rgBtn = (k, label) => { const p = rgPreset(k); return `<button class="ghost d${RG.f === p[0] && RG.t === p[1] ? ' on' : ''}" data-rg="${k}">${label}</button>`; };
// the bar: From / To boxes, quick buttons, arrows, Reset
const rgBar = () => `<div class="rg" id="rg"><span>From</span><input type="date" id="rg_f" value="${RG.f}"><span>To</span><input type="date" id="rg_t" value="${RG.t}">\
${rgBtn('all', 'All')}${rgBtn('year', 'This year')}${rgBtn('6m', '6M')}${rgBtn('3m', '3M')}${rgBtn('30d', '30D')}\
<button class="ghost d" data-rg="prev" ${rgOn() ? '' : 'disabled'} data-tip="Back by the window length">‹</button>\
<button class="ghost d" data-rg="next" ${rgOn() ? '' : 'disabled'} data-tip="Forward by the window length">›</button>\
<button class="ghost d" data-rg="reset">Reset</button></div>`;
// connect the bar's buttons and date boxes (called by render0 after the screen is drawn)
function rgWire() {
    const b = $('#rg');
    if (!b)
        return;
    b.querySelectorAll('[data-rg]').forEach(x => x.onclick = () => { rgAct(x.dataset.rg); render(); });
    // after a date box commits, redraw once focus has settled and give focus back if the click moved to the other box
    b.querySelectorAll('input').forEach(i => i.onchange = () => {
        rgSet($('#rg_f').value, $('#rg_t').value);
        setTimeout(() => { const k = document.activeElement.id; render(); if (k === 'rg_f' || k === 'rg_t') $('#' + k).focus(); }, 0);
    });
}

// Break bands: the stretches a novel (or, on the All view, every active novel at once) was on a break, shaded behind the position and speed charts.
// Break stretches of one novel [{f, t, now}] as events() sees them: an open break ends at the next log entry (else today = now); a paused book is on break until today
function breakSpans(n) {
    const ld = n.log.map(l => l.d).sort();
    return [...(n.br || []).filter(b => b.f).map(b => { const e = b.t || ld.find(x => x >= b.f); return { f: b.f, t: e || today(), now: !e }; }),
        ...(n.status === 'paused' && n.pz ? [{ f: n.pz, t: today(), now: true }] : [])];
}
// first day a novel counts as in progress ('' = never: planned, or no dates at all)
const activeFrom = n => n.status === 'planned' ? '' : n.st || n.log.map(l => l.d).filter(d => d >= '1990-01-01').sort()[0] || (n.status === 'completed' ? n.fin : '') || '';
// last day a novel counts as in progress (a finished book without a date is never counted)
const activeTo = n => n.status === 'completed' ? n.fin || lastD(n) : '9999-12-31';
// break stretches to shade: that novel's own, or on the All view only the days when every novel in progress was on break
function breakBands(nid) {
    if (nid)
        return breakSpans(S.novels.find(n => n.id === nid));
    const ns = S.novels.filter(n => activeFrom(n)), sp = new Map(ns.map(n => [n, breakSpans(n)])), end = Date.parse(today()), out = [];
    let cur = null;
    for (let t = Math.max(Date.parse('1990-01-01'), Date.parse(ns.map(activeFrom).sort()[0] || today())); t <= end; t += 864e5) {
        const d = iso(t), act = ns.filter(n => d >= activeFrom(n) && d <= activeTo(n));
        if (act.length && act.every(n => sp.get(n).some(b => d >= b.f && d <= b.t))) {
            if (!cur)
                out.push(cur = { f: d, t: d, now: false });
            cur.t = d;
        }
        else
            cur = null;
    }
    out.forEach(b => b.now = b.t === today());
    return out;
}

// Records panel (personal bests) for the Stats page, from the days you actually logged (all time, not the Stats range).
// the Monday of the week a day falls in
const monOf = d => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - (x.getUTCDay() + 6) % 7); return iso(x); };
// day shown in the records, e.g. Mar 3, 2026
const recDate = d => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
// biggest total of logged chapters over groups of days (keyOf says which group a day is in): {v, k}, earliest group wins a tie
function bestOf(byD, keyOf) {
    const s = {};
    Object.keys(byD).forEach(d => s[keyOf(d)] = (s[keyOf(d)] || 0) + byD[d]);
    return Object.keys(s).sort().reduce((b, k) => !b || s[k] > b.v ? { v: s[k], k } : b, null);
}
// longest run of consecutive reading days: {n, from, to}
function bestRun(byD) {
    let best = { n: 0, from: '', to: '' }, run = 0, prev = 0, from = '';
    Object.keys(byD).filter(d => byD[d] > 0).sort().forEach(d => {
        const t = Date.parse(d);
        run = t - prev === 864e5 ? run + 1 : 1;
        if (run === 1) from = d;
        prev = t;
        if (run > best.n) best = { n: run, from, to: d };
    });
    return best;
}
// the finished novel read fastest: {n, days} (days from start to finish, both counted); needs a start and a finish day
function fastestDone() {
    return S.novels.filter(n => n.status === 'completed' && n.st && (n.fin || lastD(n)))
        .map(n => ({ n, days: Math.round((Date.parse(n.fin || lastD(n)) - Date.parse(n.st)) / 864e5) + 1 }))
        .filter(x => x.days > 0).reduce((b, x) => !b || x.days < b.days ? x : b, null);
}
// the biggest finished novel: {n, text} (by words; by chapters when no finished novel has a word count)
function biggestDone() {
    const done = S.novels.filter(n => n.status === 'completed'), words = done.some(n => n.pages), size = n => words ? n.pages || 0 : dT(n.root);
    const top = done.reduce((b, n) => !b || size(n) > size(b) ? n : b, null);
    return top && size(top) ? { n: top, text: words ? fmtN(top.pages) + ' words' : size(top) + ' ch' } : null;
}
// one record: small label, big value, date or novel underneath
const recCell = (label, value, note) => `<div class="rc"><div class="l">${label}</div><div class="n">${value}</div><div class="d">${note}</div></div>`;
// the Records panel: day, week, month and streak records of byD (all days of this view); finished-novel records only on the All view (all = true)
function recordsPanel(byD, all) {
    const day = bestOf(byD, d => d), wk = bestOf(byD, monOf), mo = bestOf(byD, d => d.slice(0, 7)), run = bestRun(byD);
    const fast = all && fastestDone(), big = all && biggestDone(), ch = v => +v.toFixed(1) + ' ch', days = n => n + (n === 1 ? ' day' : ' days');
    const month = k => new Date(k + '-01T00:00:00Z').toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const cells = [
        day && recCell('Most chapters in a day', +day.v.toFixed(1), recDate(day.k)),
        wk && recCell('Best week', ch(wk.v), 'Week of ' + recDate(wk.k)),
        mo && recCell('Best month', ch(mo.v), month(mo.k)),
        run.n && recCell('Longest streak', days(run.n), recDate(run.from) + (run.n > 1 ? ' – ' + recDate(run.to) : '')),
        fast && recCell('Fastest novel finished', days(fast.days), esc(fast.n.t)),
        big && recCell('Biggest novel finished', big.text, esc(big.n.t))
    ].filter(Boolean);
    return cells.length ? `<div class="panel w" data-pk="records"><h3>Records</h3><div class="rec">${cells.join('')}</div></div>` : '';
}

// Chapters per month and Reading by day of the week: two bar panels for the Stats page, from the days you logged inside the Stats range.
// short and long month names for 'YYYY-MM'
const monShort = k => new Date(k + '-01T00:00:00Z').toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' });
const monLong = k => new Date(k + '-01T00:00:00Z').toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
// one bar per month from the range start (or first reading) through its end, best month highlighted, this month marked in progress
function monthRows(byD) {
    const ks = Object.keys(byD).sort(), sum = {}, rows = [];
    if (!ks.length) return rows;
    ks.forEach(d => sum[d.slice(0, 7)] = (sum[d.slice(0, 7)] || 0) + byD[d]);
    const keys = [], first = RG.f || ks[0], last = rgEnd().slice(0, 7);
    for (let y = +first.slice(0, 4), m = +first.slice(5, 7); ; m++) {
        if (m > 12) { m = 1; y++; }
        const k = y + '-' + String(m).padStart(2, '0');
        if (k > last) break;
        keys.push(k);
    }
    const best = Math.max(...keys.map(k => sum[k] || 0));
    let marked = false;
    keys.forEach(k => {
        const v = +(sum[k] || 0).toFixed(1), hi = !marked && v > 0 && v === best, part = k === today().slice(0, 7);
        marked = marked || hi;
        const tip = `${monLong(k)} · ${v} ch${part ? ' so far (month in progress)' : ''}${hi ? ' · best month' : ''}`;
        rows.push({ l: monShort(k), v, hi, part, tip });
    });
    return rows;
}
// seven bars Monday-Sunday: chapters read per day on average, i.e. the weekday's total divided by how many of that weekday the period has (first reading day or range start .. range end)
function weekdayRows(byD) {
    const ks = Object.keys(byD).sort(), names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    if (!ks.length) return [];
    const tot = Array(7).fill(0), cnt = Array(7).fill(0), wd = d => (new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7;
    ks.forEach(d => tot[wd(d)] += byD[d]);
    for (let t = Date.parse(RG.f || ks[0]); t <= Date.parse(rgEnd()); t += 864e5) cnt[wd(iso(t))]++;
    const avg = tot.map((v, i) => cnt[i] ? v / cnt[i] : 0), top = avg.indexOf(Math.max(...avg));
    return names.map((n, i) => {
        const hi = i === top && avg[i] > 0, a = +avg[i].toFixed(1);
        return { l: n.slice(0, 3), v: avg[i], hi, lab: String(a), tip: `${n}s · ${a} ch per day on average · ${cnt[i]} ${n}${cnt[i] === 1 ? '' : 's'}${hi ? ' · most' : ''}` };
    });
}
// the two panels (nothing when there is no reading to show)
const habitPanels = byD => !Object.keys(byD).length ? '' : `<div class="panel w" data-pk="months"><h3>Chapters per month</h3>${bars(monthRows(byD), 'var(--acc)')}\
<div class="cap">Green = best month · faded with a dashed edge = month still in progress</div></div>\
<div class="panel w" data-pk="weekdays"><h3>Reading by day of the week (average chapters per day)</h3>${bars(weekdayRows(byD), 'var(--acc)', false, true)}\
<div class="cap">Green = the day you read most</div></div>`;

// Novel timeline and Share by novel: two Stats panels for the All novels view. Both follow the Stats range.
const dayMs = d => Date.parse(d + 'T00:00:00Z');
// first day a novel was read: its start date or first log entry ('' = unknown)
const readStart = n => n.st || n.log.map(l => l.d).filter(d => d >= '1990-01-01').sort()[0] || '';
// timeline rows [{n, f, t, fin, status, breaks}]: started novels with a bar inside the range; the last day is today, or for a completed novel
// its finish day or its last log entry if that is later (reading went on after the finish date)
function timelineRows() {
    const rows = S.novels.filter(n => n.status !== 'planned').map(n => {
        const f = readStart(n), t = n.status === 'completed' ? [n.fin, lastD(n), f].sort().pop() : today();
        return f ? { n: n.t, f, t: t < f ? f : t, fin: n.fin, status: n.status, breaks: breakSpans(n) } : null;
    });
    const lo = RG.f ? dayMs(RG.f) : -Infinity, hi = RG.t ? dayMs(rgEnd()) : Infinity;
    return rows.filter(r => r && barSpans(r, lo, hi).length);
}
// the stretches of a row that get a bar, in ms: its first to last day minus the recorded breaks, cut to the chart's days x0..x1
function barSpans(r, x0, x1) {
    let spans = [{ f: dayMs(r.f), t: dayMs(r.t) }];
    (r.breaks || []).forEach(b => {
        const from = dayMs(b.f), to = dayMs(b.t);
        spans = spans.flatMap(s => to < s.f || from > s.t ? [s] : [
            ...(from > s.f ? [{ f: s.f, t: from - 864e5 }] : []),
            ...(to < s.t ? [{ f: to + 864e5, t: s.t }] : [])
        ]);
    });
    return spans.map(s => ({ f: Math.max(s.f, x0), t: Math.min(s.t, x1) })).filter(s => s.f <= s.t);
}
// hover text of one timeline row: start, finish (or "through"), days it took with both ends counted
function timelineTip(r) {
    const days = Math.round((dayMs(r.t) - dayMs(r.f)) / 864e5) + 1;
    const again = r.fin && r.t > r.fin, end = r.status !== 'completed' ? 'Through ' + recDate(r.t) : again ? 'Finished ' + recDate(r.fin) + ' · read again until ' + recDate(r.t) : 'Finished ' + recDate(r.t);
    return `Started ${recDate(r.f)} · ${end} · ${days} ${days === 1 ? 'day' : 'days'} · ${r.status}`;
}
// date grid lines and labels along the timeline
function timelineGrid(ticks, X, top, bottom) {
    return ticks.map((t, i) => {
        const x = X(t).toFixed(1), side = i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle';
        return `<line class="gl" x1="${x}" x2="${x}" y1="${top}" y2="${bottom}"/>` +
            `<text x="${x}" y="${bottom + 21}" text-anchor="${side}">${fmt(t)}</text>`;
    }).join('');
}
// one timeline row: the novel's name, then its bars
function timelineRow(r, i, X, x0, x1) {
    const y = 10 + i * 30 + 4, tip = esc(timelineTip(r)), cut = r.n.length > 24, label = cut ? r.n.slice(0, 23) + '…' : r.n;
    const bars = barSpans(r, x0, x1).map(s => `<rect class="tlbar ${r.status}" x="${X(s.f).toFixed(1)}" y="${y}" ` +
        `width="${Math.max(2, X(s.t + 864e5) - X(s.f)).toFixed(1)}" height="16" rx="5" ` +
        `data-start="${iso(s.f)}" data-end="${iso(s.t)}" data-tip="${tip}"/>`).join('');
    return `<text class="tln" data-name="${esc(r.n)}"${cut ? ` data-tip="${esc(r.n)}"` : ''} x="8" y="${y + 14}">${esc(label)}</text>${bars}`;
}
// the timeline chart: one status-coloured bar per novel, with gaps for breaks; from / to = the range's ends ('' = fit the novels)
function timeline(rows, from, to) {
    if (!rows.length)
        return `<div class="empty sm">${rgOn() ? 'No novels were being read in this date range.' : 'Add a start date or reading log to see your timeline.'}</div>`;
    rows = [...rows].sort((a, b) => a.f.localeCompare(b.f) || a.n.localeCompare(b.n));
    const W = chartW(), L = 190, R = 16, H = 10 + rows.length * 30 + 28, x0 = dayMs(from || rows[0].f);
    const last = dayMs(to || rows.reduce((m, r) => r.t > m ? r.t : m, rows[0].t)), x1 = last + 864e5;
    const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), ticks = x0 >= last ? [x0] : dateTicks(x0, last);
    const bars = rows.map((r, i) => timelineRow(r, i, X, x0, last)).join('');
    return `<svg class="tl" viewBox="0 0 ${W} ${H}">${timelineGrid(ticks, X, 10, H - 28)}${bars}</svg>`;
}
// the Novel timeline panel
function novelTimeline() {
    const key = ['reading', 'completed', 'paused'].map(s => `<i class="sd ${s}"></i>${s[0].toUpperCase() + s.slice(1)}`).join(' &nbsp; ');
    return `<div class="panel w" data-pk="timeline">\
<h3>Novel timeline</h3>${timeline(timelineRows(), RG.f, rgOn() ? rgEnd() : '')}<div class="cap">${key}</div></div>`;
}
// each novel's chapters (or words) read in the range: the 5 biggest by name, the rest as one "Other" row (only when it covers 2 or more novels)
function shareRows(ev, words) {
    const by = new Map(S.novels.map(n => [n.id, { l: n.t, v: 0 }]));
    ev.forEach(e => { if (by.has(e.id)) by.get(e.id).v += words ? e.pg : e.n; });
    const all = [...by.values()].map(r => ({ ...r, v: Math.round(r.v) })).filter(r => r.v > 0).sort((a, b) => b.v - a.v), rest = all.slice(5);
    return all.length <= 6 ? all : [...all.slice(0, 5), { l: 'Other', v: rest.reduce((s, r) => s + r.v, 0), count: rest.length }];
}
// one share row: name, bar, percent and amount
function shareRow(r, total, words) {
    const pct = (r.v / total * 100).toFixed(1), more = r.count ? ` (${r.count} smaller novels)` : '';
    const tip = `${r.l}${more} · ${fmtN(r.v)} ${words ? 'words' : 'chapters'} · ${pct}%`;
    return `<div class="cr"><span title="${esc(r.l)}">${esc(r.l)}</span><div class="bar" data-tip="${esc(tip)}"><i style="width:${pct}%"></i></div>` +
        `<span>${pct}% · ${fmtN(r.v)} ${words ? 'words' : 'ch'}</span></div>`;
}
// the Chapters / Words switch
const shareSwitch = words => `<div class="seg sm">` +
    `<button data-share="chapters" aria-pressed="${!words}" class="${words ? '' : 'on'}" onclick="ui.share='chapters';render()">Chapters</button>` +
    `<button data-share="words" aria-pressed="${words}" class="${words ? 'on' : ''}" onclick="ui.share='words';render()">Words</button></div>`;
// the Share by novel panel
function shareByNovel(ev) {
    const words = ui.share === 'words', rows = shareRows(ev, words), total = rows.reduce((s, r) => s + r.v, 0);
    const none = `<div class="empty sm">${rgOn() ? 'No reading in this date range.' : 'No reading logged yet.'}</div>`;
    const list = rows.length ? rows.map(r => shareRow(r, total, words)).join('') : none;
    return `<div class="panel w" data-pk="share"><h3>Share by novel</h3>${shareSwitch(words)}${list}</div>`;
}

// Stats panel order: drag a panel by its grip (top right on hover), or press the up / down arrow on the grip, to move it. The order is
// S.pref.panels, a list of the panels' data-pk keys, saved with the data and shared by the Stats page and every novel's Stats tab.
const panelEls = () => [...document.querySelectorAll('.panels > .panel[data-pk]')];
// the shown panels' keys in the saved order; panels the saved list doesn't know keep their own place
function orderedKeys(shown, saved) {
    const known = shown.filter(k => saved.includes(k)).sort((a, b) => saved.indexOf(a) - saved.indexOf(b));
    let i = 0;
    return shown.map(k => saved.includes(k) ? known[i++] : k);
}
// the saved list after the shown panels were rearranged: keys of panels not shown now stay where they were, new keys go last
function mergedOrder(saved, shown) {
    const here = shown.filter(k => saved.includes(k));
    let i = 0;
    return [...saved.map(k => shown.includes(k) ? here[i++] : k), ...shown.filter(k => !saved.includes(k))];
}
// put the panels on the page in the saved order
function applyPanelOrder() {
    const els = panelEls(), box = els[0] && els[0].parentNode;
    if (box)
        orderedKeys(els.map(e => e.dataset.pk), prefs().panels || []).forEach(k => box.appendChild(els.find(e => e.dataset.pk === k)));
}
// remember the order that is on the page now
function savePanelOrder() {
    S.pref = { ...prefs(), panels: mergedOrder(prefs().panels || [], panelEls().map(e => e.dataset.pk)) };
    save();
    if ($('#panelReset'))
        $('#panelReset').disabled = false;
}
// back to the built-in order
function resetPanels() {
    const p = { ...prefs() };
    delete p.panels;
    S.pref = p;
    save();
    render();
}
// the reset button of the Stats controls (greyed out while the order is the built-in one)
const panelReset = () => `<button class="ghost d" id="panelReset" onclick="resetPanels()" ${(prefs().panels || []).length ? '' : 'disabled'}>Reset panel order</button>`;
// do a DOM move and slide the other panels from where they were to where they are now
function flip(move, skip) {
    const els = panelEls().filter(e => e !== skip), before = els.map(e => e.getBoundingClientRect());
    move();
    els.forEach((e, i) => {
        const a = before[i], b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
        if (dx || dy)
            e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 180, easing: 'ease' });
    });
}
// put a panel into the place of another one (before it if it was after, else after it)
function movePanelTo(el, target) {
    el.parentNode.insertBefore(el, el.compareDocumentPosition(target) & Node.DOCUMENT_POSITION_FOLLOWING ? target.nextSibling : target);
}
// where a panel sits in the layout, ignoring a slide animation that is still running
function layoutRect(el) {
    const r = el.getBoundingClientRect(), m = new DOMMatrix(getComputedStyle(el).transform);
